gitlab-runner:
  # The runner and its jobs reach GitLab through the Service, not the ingress name, so they need no DNS.
  gitlabUrl: http://gitlab.gitlab.svc.cluster.local
  # Six jobs at a time. Each job pod requests 1.5 vCPU and 6 GiB, so six fit on the jobs node (16 vCPU, 48 GiB)
  # with room for the kubelet and the network pods. The CPU has a request and no limit, because a limit makes the
  # kernel throttle a bursty job on an idle node. The memory request equals the limit, so the
  # scheduler reserves it.
  concurrent: 6
  # The default image of a job pod. The config below reads it, so Renovate can track it.
  # renovate: datasource=docker depName=alpine
  jobImageTag: "3.24"
  rbac:
    create: true
  metrics:
    enabled: true
  nodeSelector: {}
  runners:
    # The first-objects Job writes this Secret. It holds the token of the runner it created.
    secret: gitlab-runner
    config: |
      [[runners]]
        clone_url = "http://gitlab.gitlab.svc.cluster.local"
        [runners.kubernetes]
          namespace = "{{.Release.Namespace}}"
          image = "alpine:{{ .Values.jobImageTag }}"
          cpu_request = "1500m"
          memory_request = "6Gi"
          # The kube-compute check peaks at 4.4 GiB: tofu test starts several provider plugins. At a
          # 3 GiB limit it hit the limit and plugin start timed out.
          memory_limit = "6Gi"
          # Job pods run on the jobs pool, away from GitLab and the platform.
          [runners.kubernetes.node_selector]
            "kube-compute.io/node-group" = "jobs"
