gitlab-runner:
  # The runner and its jobs reach GitLab through the Service, not the ingress name, so they need no DNS.
  gitlabUrl: http://gitlab.gitlab.svc.cluster.local
  # One job at a time, as on a single GitHub runner. The job pod is sized like GitHub's runner for a
  # public repository: 4 vCPU and 16 GB. The CPU has a request and no limit, because a limit makes
  # the kernel throttle a bursty job on an idle node. The memory request equals the limit, so the
  # scheduler reserves it.
  concurrent: 1
  # The default image of a job pod. The config below reads it, so Renovate can track it.
  # renovate: datasource=docker depName=alpine
  jobImageTag: "3.24"
  rbac:
    create: true
  nodeSelector: {}
  runners:
    # The first-objects Job writes this Secret. It holds the token of the runner it created.
    secret: gitlab-runner
    config: |
      [[runners]]
        clone_url = "http://gitlab.gitlab.svc.cluster.local"
        [runners.kubernetes]
          namespace = "{{.Release.Namespace}}"
          image = "alpine:{{ .Values.jobImageTag }}"
          cpu_request = "4"
          memory_request = "16Gi"
          # The kube-compute check peaks at 4.4 GiB: tofu test starts several provider plugins. At a
          # 3 GiB limit it hit the limit and plugin start timed out.
          memory_limit = "16Gi"
          # Job pods never run on the privileged node. Its taint already stops them,
          # and this term keeps them off it if the taint is ever removed.
          [runners.kubernetes.affinity]
            [runners.kubernetes.affinity.node_affinity]
              [runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution]
                [[runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution.node_selector_terms]]
                  [[runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution.node_selector_terms.match_expressions]]
                    key = "ci.kube-stack/privileged"
                    operator = "DoesNotExist"
