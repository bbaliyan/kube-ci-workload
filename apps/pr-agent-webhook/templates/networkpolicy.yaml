{{- with .Values.allowFrom }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pr-agent-webhook.name" $ }}
  labels:
    {{- include "pr-agent-webhook.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pr-agent-webhook.selector" $ | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.port }}
          protocol: TCP
{{- end }}
