{{- with .Values.ingressRoute }}
{{- if .enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "pr-agent-webhook.name" $ }}
  labels:
    {{- include "pr-agent-webhook.labels" $ | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ required "ingressRoute.enabled needs ingressRoute.host, the host name that the sender calls" .host }}`)
      kind: Rule
      services:
        - name: {{ include "pr-agent-webhook.name" $ }}
          port: {{ $.Values.port }}
  {{- if .tlsSecretName }}
  tls:
    secretName: {{ .tlsSecretName }}
  {{- else }}
  tls: {}
  {{- end }}
{{- end }}
{{- end }}
