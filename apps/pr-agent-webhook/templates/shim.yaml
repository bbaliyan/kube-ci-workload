{{- $name := include "pr-agent-webhook.name" . }}
{{- $config := include "pr-agent-webhook.config" . | fromJson }}
{{- $jwksCa := and .Values.pipeline.enabled .Values.pipeline.jwksCa.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "pr-agent-webhook.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "pr-agent-webhook.labels" . | nindent 4 }}
data:
  {{- range $file, $content := $config }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pr-agent-webhook.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pr-agent-webhook.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pr-agent-webhook.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson $config | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      containers:
        - name: envoy
          image: {{ .Values.image }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--disable-hot-restart"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
            - {name: secret, mountPath: /secrets, readOnly: true}
            - {name: router-client, mountPath: /run/router-client, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $jwksCa }}
            - {name: jwks-ca, mountPath: /etc/jwks-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: secret
          secret:
            secretName: {{ .Values.secret.name }}
            items:
              - key: {{ .Values.secret.key }}
                path: WEBHOOK_SECRET
        # The pod identity certificate gives the router the SPIFFE ID of the service account.
        - name: router-client
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: router-ca.pem
        - name: tmp
          emptyDir: {}
        {{- if $jwksCa }}
        - name: jwks-ca
          configMap:
            name: {{ .Values.pipeline.jwksCa.name }}
            items:
              - key: {{ .Values.pipeline.jwksCa.key }}
                path: ca.pem
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pr-agent-webhook.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pr-agent-webhook.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
