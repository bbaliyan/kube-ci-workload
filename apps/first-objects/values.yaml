image:
  repository: ghcr.io/bbaliyan/kube-devenv
  tag: 0.13.1

# Where GitLab runs, and where the runner is installed.
gitlabNamespace: gitlab
gitlabPod: gitlab-0
runnerNamespace: gitlab-runner

# The address the Job uses for the GitLab API: the Service inside the cluster.
gitlabApi: http://gitlab.gitlab.svc.cluster.local

# The group that holds the mirror projects.
mirrorGroup: mirror

nodeSelector: {}
tolerations: []
