# A ClusterSecretStore that reads Secrets of one namespace of this cluster. It needs no
# external secret manager. The consumer writes the source Secret at first boot.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.secretNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-secrets-reader
  namespace: {{ .Values.secretNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-secrets-reader
  namespace: {{ .Values.secretNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-secrets-reader
  namespace: {{ .Values.secretNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-secrets-reader
subjects:
  - kind: ServiceAccount
    name: ci-secrets-reader
    namespace: {{ .Values.secretNamespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ci-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.secretNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Values.secretNamespace }}
      auth:
        serviceAccount:
          name: ci-secrets-reader
          namespace: {{ .Values.secretNamespace }}
