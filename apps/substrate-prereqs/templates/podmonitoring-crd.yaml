# A stub of the GKE PodMonitoring CRD. The base manifests of Substrate v1.0.0 hold a
# PodMonitoring object, and ate-setup refuses to apply them without the CRD. A cluster without
# the GKE operator needs this too (upstream issue #2589; see the workaround ledger in the README).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podmonitorings.monitoring.googleapis.com
spec:
  group: monitoring.googleapis.com
  scope: Namespaced
  names:
    kind: PodMonitoring
    listKind: PodMonitoringList
    plural: podmonitorings
    singular: podmonitoring
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
