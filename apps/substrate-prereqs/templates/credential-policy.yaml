{{- if .Values.credentialPolicy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: {{ .Values.controlPlaneNamespace }}
data:
  namespace-policy.yaml: |
    policies:
    - atespace: {{ .Values.credentialPolicy.atespace }}
      allowedNamespaces:
      - {{ .Values.credentialPolicy.namespace }}
{{- end }}
