# The root keys of the in-cluster S3 store are generated here, once, as the Secret sourceSecret in
# secretNamespace. External Secrets reads it back through a ClusterSecretStore, so no key is in
# this repo, in Terraform state or in a sops file.
secretNamespace: ci-secrets
sourceSecret: object-store
accessKeyProperty: access-key
secretKeyProperty: secret-key

# The control plane namespace and the Secret that the install chart reads for the snapshot store.
controlPlaneNamespace: ate-system
snapshotKeysSecret: snapshot-store-keys
accessKeyKey: access-key-id
secretKeyKey: secret-access-key

# The credential provider of the control plane reads a Secret only in a namespace that the atespace
# of the actor may use. The install makes this policy empty, and only when it is missing, so it is
# made here, before the install. The provider reads it once at start.
credentialPolicy:
  enabled: false
  atespace: reviews
  namespace: substrate-system
