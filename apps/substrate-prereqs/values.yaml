# A Secret in secretNamespace holds the object store keys. The consumer makes it at first boot.
# External Secrets reads it through a ClusterSecretStore, so no key is in this repo.
secretNamespace: ci-secrets
sourceSecret: object-store
accessKeyProperty: access-key
secretKeyProperty: secret-key

# The control plane namespace and the Secret that the install chart reads for the snapshot store.
controlPlaneNamespace: ate-system
snapshotKeysSecret: snapshot-store-keys
accessKeyKey: access-key-id
secretKeyKey: secret-access-key

# The in-cluster S3 store (RustFS from the platform) and the bucket for the snapshots.
rustfs:
  namespace: rustfs
  endpoint: http://rustfs.rustfs.svc:9000
  credentialsSecret: rustfs-credentials
bucket: substrate-snapshots
region: us-east-1
# renovate: datasource=docker depName=amazon/aws-cli
awsCliImage: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
nodeSelector: {}
