suite: substrate prerequisites
templates:
  - templates/secret-store.yaml
  - templates/snapshot-keys.yaml
  - templates/bucket-job.yaml
tests:
  - it: reads the keys from a namespace of this cluster, through a ClusterSecretStore
    template: templates/secret-store.yaml
    documentSelector:
      path: kind
      value: ClusterSecretStore
    asserts:
      - equal:
          path: spec.provider.kubernetes.remoteNamespace
          value: ci-secrets
  - it: gives the install chart a Secret with the key names it reads
    template: templates/snapshot-keys.yaml
    asserts:
      - equal:
          path: metadata.name
          value: snapshot-store-keys
      - equal:
          path: metadata.namespace
          value: ate-system
      - equal:
          path: spec.data[0].secretKey
          value: access-key-id
      - equal:
          path: spec.data[1].remoteRef.property
          value: secret-key
  - it: creates the bucket with the RustFS root keys, in the RustFS namespace
    template: templates/bucket-job.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: rustfs
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: RUSTFS_ACCESS_KEY
      - equal:
          path: spec.template.spec.containers[0].env[4].value
          value: substrate-snapshots
