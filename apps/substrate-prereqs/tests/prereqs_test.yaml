suite: substrate prerequisites
templates:
  - templates/secret-store.yaml
  - templates/snapshot-keys.yaml
  - templates/object-store-keys.yaml
  - templates/credential-policy.yaml
tests:
  - it: reads the keys from a namespace of this cluster, through a ClusterSecretStore
    template: templates/secret-store.yaml
    documentSelector:
      path: kind
      value: ClusterSecretStore
    asserts:
      - equal:
          path: spec.provider.kubernetes.remoteNamespace
          value: ci-secrets
  - it: gives the install chart a Secret with the key names it reads
    template: templates/snapshot-keys.yaml
    asserts:
      - equal:
          path: metadata.name
          value: snapshot-store-keys
      - equal:
          path: metadata.namespace
          value: ate-system
      - equal:
          path: spec.data[0].secretKey
          value: access-key-id
      - equal:
          path: spec.data[1].remoteRef.property
          value: secret-key
  - it: generates the store keys once, in the store namespace
    template: templates/object-store-keys.yaml
    documentSelector:
      path: kind
      value: ExternalSecret
    asserts:
      - equal:
          path: spec.refreshInterval
          value: "0"
      - equal:
          path: metadata.namespace
          value: ci-secrets
      - equal:
          path: spec.dataFrom[0].rewrite[0].regexp.target
          value: access-key
  - it: makes the credential namespace policy only when asked, so the install finds it and keeps it
    template: templates/credential-policy.yaml
    set:
      credentialPolicy:
        enabled: true
        atespace: reviews
        namespace: substrate-system
    asserts:
      - equal:
          path: metadata.name
          value: k8s-credential-provider-namespace-policy
      - equal:
          path: metadata.namespace
          value: ate-system
      - matchRegex:
          path: data["namespace-policy.yaml"]
          pattern: "atespace: reviews\n  allowedNamespaces:\n  - substrate-system"
  - it: makes no credential policy by default
    template: templates/credential-policy.yaml
    asserts:
      - hasDocuments:
          count: 0
