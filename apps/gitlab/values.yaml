# GitLab moves one minor release at a time, because it has required upgrade stops.
# Renovate does not merge it. See https://docs.gitlab.com/update/upgrade_paths/
image:
  repository: gitlab/gitlab-ce
  tag: 19.5.1-ce.0

# The canonical address. GitLab builds its links and clone URLs from it. It must start with http://
# or https://. With https, TLS ends at the proxy in front of GitLab (the tailnet Ingress), and
# GitLab itself listens on plain HTTP. The bootstrap chart sets the real one.
externalUrl: http://gitlab.example

# The tailnet Ingress, from the Tailscale operator. Its host name is the first label of externalUrl, so the
# canonical address is set in one place.
# It is served by the ProxyGroup of the operator app, as the Tailscale Service svc:<hostname>. The tailnet
# policy must auto-approve that Service (README). proxyGroup must name that group; the bootstrap chart sets it.
tailnet:
  enabled: false
  proxyGroup: ci-proxy

# A Traefik route on the LAN for this host name. Empty turns it off. Sign-in does not work over plain
# HTTP when externalUrl is https, because GitLab sets cookies for HTTPS. Git and the API work.
lanHost: ""
# The Traefik entry point for lanHost. The platform names its plain HTTP one `web`.
entryPoint: web

storageClass: local-path
configSize: 1Gi
dataSize: 40Gi

# Sized for a node with 4 vCPU and 16 GiB. The limit leaves room for the kernel and kubelet.
resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    memory: 14Gi

nodeSelector: {}
tolerations: []

# Extra lines for GITLAB_OMNIBUS_CONFIG (Ruby), added after external_url. Empty keeps every default.
omnibusConfig: ""
