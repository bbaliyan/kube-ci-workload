# GitLab moves one minor release at a time, because it has required upgrade stops.
# Renovate does not merge it. See https://docs.gitlab.com/update/upgrade_paths/
image:
  repository: gitlab/gitlab-ce
  tag: 19.5.1-ce.0

# The address people use, and the name of the Traefik route. It must start with http:// or https://.
# The bootstrap chart sets the real one.
externalUrl: http://gitlab.example

# The Traefik entry point that serves externalUrl. The platform names its plain HTTP one `web`.
entryPoint: web

storageClass: local-path
configSize: 1Gi
dataSize: 40Gi

# Sized for a node with 4 vCPU and 16 GiB. The limit leaves room for the kernel and kubelet.
resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    memory: 14Gi

nodeSelector: {}
tolerations: []

# Extra lines for GITLAB_OMNIBUS_CONFIG (Ruby), added after external_url. Empty keeps every default.
omnibusConfig: ""
