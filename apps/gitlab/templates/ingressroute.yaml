{{- if .Values.lanHost }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab
  labels:
    app.kubernetes.io/name: gitlab
spec:
  entryPoints:
    - {{ .Values.entryPoint }}
  routes:
    - match: Host(`{{ .Values.lanHost }}`)
      kind: Rule
      services:
        - name: gitlab
          port: 80
{{- end }}
