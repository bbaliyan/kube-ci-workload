{{- if .Values.tailnet.enabled }}
# Needs the Tailscale operator (apps/tailscale-operator). The operator starts a proxy that joins the
# tailnet as this host name and ends TLS with a certificate from Tailscale.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-tailscale
  labels:
    app.kubernetes.io/name: gitlab
  annotations:
    tailscale.com/hostname: {{ .Values.tailnet.hostname }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gitlab
      port:
        number: 80
  tls:
    - hosts:
        - {{ .Values.tailnet.hostname }}
{{- end }}
