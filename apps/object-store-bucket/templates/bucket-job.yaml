# RustFS 1.0.x cannot create a bucket on its own, so this Job calls the S3 API with curl, which signs the request itself.
# It runs on every sync and does nothing if the bucket exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: substrate-bucket
  namespace: {{ .Values.rustfs.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: create-bucket
          image: {{ .Values.curlImage }}
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rustfs.credentialsSecret }}, key: RUSTFS_ACCESS_KEY}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rustfs.credentialsSecret }}, key: RUSTFS_SECRET_KEY}
            - {name: REGION, value: {{ .Values.region | quote }}}
            - {name: ENDPOINT, value: {{ .Values.rustfs.endpoint | quote }}}
            - {name: BUCKET, value: {{ .Values.bucket | quote }}}
          command:
            - /bin/sh
            - -c
            - |
              s3() { curl -sSf --user "$ACCESS_KEY:$SECRET_KEY" --aws-sigv4 "aws:amz:$REGION:s3" "$@"; }
              for i in $(seq 1 60); do
                s3 -I "$ENDPOINT/$BUCKET" >/dev/null 2>&1 && exit 0
                s3 -X PUT "$ENDPOINT/$BUCKET" >/dev/null 2>&1 && exit 0
                echo "waiting for the object store ($i/60)"
                sleep 5
              done
              exit 1
