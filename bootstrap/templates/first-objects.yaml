apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: first-objects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/first-objects
    helm:
      valuesObject:
        {{- $values := dict "nodeSelector" .Values.firstObjects.nodeSelector -}}
        {{- if .Values.prAgent.enabled }}{{- $_ := set $values "prAgentNamespace" .Values.prAgent.namespace -}}{{- end }}
        {{- if and .Values.prAgent.enabled .Values.prAgent.webhookProjects }}
        {{- if not .Values.prAgent.webhook }}{{ fail "prAgent.webhookProjects needs prAgent.webhook, because the webhook points at the shim" }}{{ end }}
        {{- $_ := set $values "prAgentWebhookUrl" (printf "http://pr-agent-webhook.%s.svc.cluster.local:%v/webhook" .Values.prAgent.namespace (.Values.prAgent.webhook.port | default 8080)) -}}
        {{- $_ := set $values "prAgentWebhookProjects" .Values.prAgent.webhookProjects -}}
        {{- end }}
        {{- mergeOverwrite $values .Values.firstObjects.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
