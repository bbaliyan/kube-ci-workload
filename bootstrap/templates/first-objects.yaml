apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: first-objects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/first-objects
    helm:
      valuesObject:
        {{- mergeOverwrite (dict "nodeSelector" .Values.firstObjects.nodeSelector) .Values.firstObjects.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
