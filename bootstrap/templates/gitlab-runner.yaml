apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/gitlab-runner
    helm:
      valuesObject:
        {{- mergeOverwrite (dict "gitlab-runner" (dict "nodeSelector" .Values.runner.nodeSelector)) .Values.runner.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The PodMonitor CRD comes from the platform, which may still be starting.
    retry:
      limit: 10
      backoff:
        duration: 1m
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
