apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/ci-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The PrometheusRule CRD comes from the platform, which may still be starting.
    retry:
      limit: 10
      backoff:
        duration: 1m
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
