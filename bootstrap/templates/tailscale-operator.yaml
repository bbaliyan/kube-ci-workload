apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Every tailnet Ingress and the ProxyGroup depend on the operator, so it syncs first. Argo CD never prunes or deletes it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/tailscale-operator
    helm:
      valuesObject:
        {{- mergeOverwrite (dict "proxyGroup" (dict "name" .Values.tailscale.proxyGroup)) .Values.tailscale.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
