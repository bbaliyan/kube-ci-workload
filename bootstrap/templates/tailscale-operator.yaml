apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Every tailnet Ingress depends on the operator. Argo CD never prunes or deletes it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/tailscale-operator
    {{- with .Values.tailscale.helmValues }}
    helm:
      valuesObject:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
