apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The GitLab data lives in this namespace. Deleting the Application keeps it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/gitlab
    helm:
      valuesObject:
        {{- mergeOverwrite (dict "externalUrl" .Values.gitlab.externalUrl "nodeSelector" .Values.gitlab.nodeSelector "tolerations" .Values.gitlab.tolerations) .Values.gitlab.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
