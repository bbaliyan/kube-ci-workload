apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mirror-sync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/mirror-sync
    helm:
      valuesObject:
        {{- mergeOverwrite (dict "nodeSelector" .Values.mirrorSync.nodeSelector) .Values.mirrorSync.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
