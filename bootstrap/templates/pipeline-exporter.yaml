apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipeline-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: apps/pipeline-exporter
    helm:
      valuesObject:
        {{- mergeOverwrite (dict "gitlab-ci-pipelines-exporter" (dict "nodeSelector" .Values.pipelineExporter.nodeSelector)) .Values.pipelineExporter.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The ServiceMonitor CRD comes from the platform, which may still be starting.
    retry:
      limit: 10
      backoff:
        duration: 1m
        maxDuration: 10m
