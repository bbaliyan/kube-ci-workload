# Point one Argo CD Application at this chart and override the values below there.
# The defaults are placeholders: the real host names belong to the consumer.
repoURL: https://github.com/bbaliyan/kube-ci-workload
revision: main

gitlab:
  # The canonical address: the tailnet name. GitLab builds its links and clone URLs from it.
  # Override it with your tailnet.
  externalUrl: https://git.example.ts.net
  # The tailnet Ingress. The first label of externalUrl must equal the hostname.
  tailnet:
    enabled: true
    hostname: git
  # A second door on the LAN, through Traefik, for git and the API over plain HTTP.
  # Sign-in does not work on it: GitLab sets cookies for HTTPS. Empty turns it off.
  lanHost: ""
  # The GitLab node pool is tainted, so only GitLab runs on it.
  nodeSelector:
    kube-compute.io/node-group: gitlab
  tolerations:
    - key: dedicated
      operator: Equal
      value: gitlab
      effect: NoSchedule
  helmValues: {}

# Small workloads run next to the platform, on the general worker.
firstObjects:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

runner:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# The operator that puts the GitLab Ingress on the tailnet. kube-homelab delivers its OAuth client.
tailscale:
  helmValues: {}
