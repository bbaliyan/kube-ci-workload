# Point one Argo CD Application at this chart and override the values below there.
# The defaults are placeholders: the real host names belong to the consumer.
repoURL: https://github.com/bbaliyan/kube-ci-workload
revision: main

gitlab:
  # The canonical address: the tailnet name. GitLab builds its links and clone URLs from it.
  # Override it with your tailnet.
  externalUrl: https://git-ci.example.ts.net
  # The tailnet Ingress. Its host name is the first label of externalUrl.
  tailnet:
    enabled: true
  # A second door on the LAN, through Traefik, for git and the API over plain HTTP.
  # Sign-in does not work on it: GitLab sets cookies for HTTPS. Empty turns it off.
  lanHost: ""
  # GitLab runs next to the platform, on the general worker. It needs room for its memory limit.
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# The NAS iSCSI storage class. The consumer makes the Secret in kube-system: key
# driver-config-file.yaml, the democratic-csi driver config. The class is the cluster default.
# platform-values/observability.yaml names the same class.
storageProvisioner:
  platformRepoURL: https://github.com/bbaliyan/kube-platform.git
  platformRevision: stable
  className: nas
  csiDriverName: org.democratic-csi.freenas-api-iscsi-ci
  driverConfigSecret: truenas-iscsi-ci-driver-config

# Small workloads run next to the platform, on the general worker.
firstObjects:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

runner:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# The mirror sync Deployment. Set the repository list and the GitHub owner here, for example
# helmValues: {repos: [...], sourceBase: https://github.com/<owner>}. The consumer also makes
# the Secret github-source (key token) in the gitlab namespace.
mirrorSync:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# Exports the status and durations of the mirrored projects' pipelines to Prometheus.
pipelineExporter:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# Tailnet names for Argo CD (argocd-ci) and Grafana (grafana-ci). The names are in apps/tailnet-ingresses.
tailnetIngresses:
  helmValues: {}

# The operator that puts the GitLab Ingress on the tailnet. kube-homelab delivers its OAuth client.
tailscale:
  # The ProxyGroup that serves every tailnet Ingress. GitLab and the later apps use this name.
  proxyGroup: ci-proxy
  helmValues: {}

# The S3 store for the Substrate snapshots: RustFS from kube-platform, one replica on one block
# volume of the NAS class. It cannot grow in place. It is on for this cluster. Set enabled to
# false on another cluster. The root keys are generated in the cluster (see substrate-prereqs).
rustfs:
  enabled: true
  repoURL: https://github.com/bbaliyan/kube-platform.git
  # The contract branch of kube-platform. Only its promote workflow moves it.
  revision: stable
  storageClassName: nas
  storageSize: 30Gi
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}
  bucketHelmValues: {}

# Agent Substrate: the control plane that runs sandboxed, suspendable agents. It stores snapshots
# in the S3 store above, so it needs rustfs.enabled.
substrate:
  enabled: true
  # The charts and the install image come from kube-agent-substrate. Pin a commit.
  repoURL: https://github.com/bbaliyan/kube-agent-substrate
  revision: 408ab73fa48c0fca50bb837cd436c60483e3d13b
  # The digest of the install image published for that commit (substrate-install:main-408ab73).
  installImageDigest: sha256:e9ef933bd04e5e7f2d01911ba7257ca8a97117ba32b41b2261f3fbaabc88c30c
  namespace: ate-system
  bucket: substrate-snapshots
  s3Endpoint: http://rustfs.rustfs.svc:9000
  # The Secret in ci-secrets that holds the generated root keys of the store.
  keysSecret: object-store
  # Any fixed level works. Keep it the same on every node.
  selinuxLevel: "s0:c100,c200"
  nodeSelector:
    kube-compute.io/node-group: general
  prereqs:
    helmValues: {}
  install:
    helmValues: {}
  # The gVisor worker pool. Each worker pod needs its cpu and memory free on the general node,
  # beside the control plane. The chart sets the limits equal to the requests. A worker must be larger
  # than the actor it runs: an actor with the limits of prAgent.cpuMillicores and prAgent.memoryBytes does
  # not fit on a worker of the same size ("no worker has room for the actor").
  workers:
    replicas: 2
    cpu: "2"
    memory: 4Gi
    helmValues: {}

# The pr-agent actor: it reviews merge requests with a model that runs outside the cluster. It is
# off until you set modelEndpoint and enabled. It needs substrate.enabled. See the README, "pr-agent".
prAgent:
  enabled: false
  # The atespace of the actor.
  atespace: reviews
  # The namespace of the actor, its registration and the Secrets of the actor: gitlab-pr-agent (keys token
  # and WEBHOOK_SECRET) and the key Secret of the model server. first-objects makes the namespace and is its only
  # owner. The credential provider may read Secrets of this namespace only. Do not use a namespace of Substrate.
  namespace: pr-agent
  # The gitlab_webhook image of pr-agent. Pin the tag and the digest.
  # renovate: datasource=docker depName=pragent/pr-agent versioning=docker
  image: pragent/pr-agent:0.50.0-gitlab_webhook@sha256:dd10e3f8f5079b42e54e46c231932d28d5d48084337998e04fe7acf667d70840
  # The model, as the model name of pr-agent: a provider prefix and a name. The prefix must be ollama or openai
  # (the latter for any server with an OpenAI-compatible API).
  model: ollama/qwen3-coder:30b
  # The base URL of the model server. The consumer sets it. Use a DNS name, not an IP address. Empty fails the render.
  modelEndpoint: ""
  # Optional. A Secret in `namespace` that holds the key of the model server: {name: ..., key: ...}. The egress
  # proxy sends it as a bearer token, so the actor never holds it. Leave it empty for a server with no login.
  # The pr-agent settings OLLAMA__API_KEY and OPENAI__KEY hold only a placeholder.
  modelApiKeySecret: {}
  # The context length of the model server, in tokens. It must equal the setting on the server.
  contextLength: 16000
  # The GitLab address the actor uses. The egress policy allows its host and sets the token there.
  gitlabUrl: http://gitlab.gitlab.svc.cluster.local
  # More GitLab addresses that the actor may call, with the same token. GitLab builds the links to the next page of
  # a long list from its external URL, and python-gitlab follows them. pr-agent has no setting to keep the base URL.
  # If a review of a large merge request fails on a page link, add the external URL here. An https address needs
  # egressTrustBundle.
  gitlabExtraUrls: []
  # The webhook shim checks the real webhook secret and sends this fixed value in X-Gitlab-Token. The actor
  # expects the same value in GITLAB__SHARED_SECRET. It is public and is not the webhook secret.
  hopToken: internal-hop-from-the-webhook-shim
  # Set true only when the substrate-actor chart of substrate.revision accepts the key egressTrustBundle, which mounts
  # the CA of the egress gateway into the actor. An https gitlabUrl or modelEndpoint needs it. Without it
  # the render fails on https, because every TLS call from the actor would fail.
  egressTrustBundle: false
  cpuMillicores: 1000
  memoryBytes: 2147483648
  # The webhook shim of the substrate-actor chart. It checks X-Gitlab-Token against the key WEBHOOK_SECRET of the
  # Secret gitlab-pr-agent and sends hopToken to the actor. It needs a chart revision that has the shim.
  # Empty means no shim, and GitLab cannot reach the actor. Set the keys of `webhook`, for example ingress and allowFrom.
  webhook: {}
  # Project paths that get a GitLab webhook to the shim, for example [mirror/kube-compute]. first-objects makes the
  # webhook (merge request and comment events) and allows webhooks to local addresses in GitLab, an instance-wide
  # setting. Empty makes no webhook: do it by hand, as the README says. It needs `webhook`. Each project must exist.
  webhookProjects: []
  # Extra values for the actor chart, which the registration chart does not read.
  actorHelmValues: {}
  registration:
    # The registration image: kubectl-ate, jq, curl and bash. The chart schema accepts only a release number
    # as the tag, and the digest decides what the node pulls. The digest is the image of the commit
    # that substrate.revision pins (substrate-registration:main-408ab73).
    version: v1.0.0
    digest: sha256:e3a3177940ca2d21972e370ed79860cc1d37a93458ec34e961b5c6c20854b818
    helmValues: {}
  # Suspends the actor when it is idle. Off by default: it needs a Prometheus that scrapes the control plane,
  # and a cluster admin must grant its service account the editor role in the atespace (README, "pr-agent").
  idleSuspend:
    enabled: false
    # The Prometheus of kube-platform.
    prometheusUrl: http://prometheus-prometheus.prometheus.svc:9090
    idleMinutes: 30
    helmValues: {}
