# Point one Argo CD Application at this chart and override the values below there.
# The defaults are placeholders: the real host names belong to the consumer.
repoURL: https://github.com/bbaliyan/kube-ci-workload
revision: main

gitlab:
  # The canonical address: the tailnet name. GitLab builds its links and clone URLs from it.
  # Override it with your tailnet.
  externalUrl: https://git-ci.example.ts.net
  # The tailnet Ingress. Its host name is the first label of externalUrl.
  tailnet:
    enabled: true
  # A second door on the LAN, through Traefik, for git and the API over plain HTTP.
  # Sign-in does not work on it: GitLab sets cookies for HTTPS. Empty turns it off.
  lanHost: ""
  # GitLab runs next to the platform, on the general worker. It needs room for its memory limit.
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# The NAS iSCSI storage class. The consumer makes the Secret in kube-system: key
# driver-config-file.yaml, the democratic-csi driver config. The class is the cluster default.
# platform-values/observability.yaml names the same class.
storageProvisioner:
  platformRepoURL: https://github.com/bbaliyan/kube-platform.git
  platformRevision: stable
  className: nas
  csiDriverName: org.democratic-csi.freenas-api-iscsi-ci
  driverConfigSecret: truenas-iscsi-ci-driver-config

# Small workloads run next to the platform, on the general worker.
firstObjects:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

runner:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# The mirror sync Deployment. Set the repository list and the GitHub owner here, for example
# helmValues: {repos: [...], sourceBase: https://github.com/<owner>}. The consumer also makes
# the Secret github-source (key token) in the gitlab namespace.
mirrorSync:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# Exports the status and durations of the mirrored projects' pipelines to Prometheus.
pipelineExporter:
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}

# Tailnet names for Argo CD (argocd-ci) and Grafana (grafana-ci). The names are in apps/tailnet-ingresses.
tailnetIngresses:
  helmValues: {}

# The operator that puts the GitLab Ingress on the tailnet. kube-homelab delivers its OAuth client.
tailscale:
  # The ProxyGroup that serves every tailnet Ingress. GitLab and the later apps use this name.
  proxyGroup: ci-proxy
  helmValues: {}

# The S3 store for the Substrate snapshots: RustFS from kube-platform, one replica on one block
# volume of the NAS class. It cannot grow in place. It is on for this cluster. Set enabled to
# false on another cluster. The root keys are generated in the cluster (see substrate-prereqs).
rustfs:
  enabled: true
  repoURL: https://github.com/bbaliyan/kube-platform.git
  # The contract branch of kube-platform. Only its promote workflow moves it.
  revision: stable
  storageClassName: nas
  storageSize: 30Gi
  nodeSelector:
    kube-compute.io/node-group: general
  helmValues: {}
  bucketHelmValues: {}

# Agent Substrate: the control plane that runs sandboxed, suspendable agents. It stores snapshots
# in the S3 store above, so it needs rustfs.enabled.
substrate:
  enabled: true
  # The charts and the install image come from kube-agent-substrate. Pin a commit.
  repoURL: https://github.com/bbaliyan/kube-agent-substrate
  revision: 0d7451ca840f10e5ac5432b7abcc00cb3d88ef86
  # The digest of the install image published for that commit (substrate-install:main-0d7451c).
  installImageDigest: sha256:a94e4d36f29aa2ef40405792a736b52227722272863a8e769b5e36802451de96
  namespace: ate-system
  bucket: substrate-snapshots
  s3Endpoint: http://rustfs.rustfs.svc:9000
  # The Secret in ci-secrets that holds the generated root keys of the store.
  keysSecret: object-store
  # Any fixed level works. Keep it the same on every node.
  selinuxLevel: "s0:c100,c200"
  nodeSelector:
    kube-compute.io/node-group: general
  prereqs:
    helmValues: {}
  install:
    helmValues: {}
  # The gVisor worker pool. Each worker pod needs its cpu and memory free on the general node,
  # beside the control plane. The chart sets the limits equal to the requests.
  workers:
    replicas: 2
    cpu: "1"
    memory: 2Gi
    helmValues: {}
